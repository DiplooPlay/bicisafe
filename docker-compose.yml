services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bicisafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bicisafe
      POSTGRES_USER: bicisafe
      POSTGRES_PASSWORD: bicisafe
    ports:
      - "5432:5432"
    volumes:
      - bicisafe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bicisafe -d bicisafe"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bicisafe-pgdata:
