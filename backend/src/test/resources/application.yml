spring:
  application:
    name: bicisafe
  datasource:
    url: jdbc:h2:mem:bicisafe;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025

app:
  cors:
    allowed-origins: http://localhost:5173
  frontend:
    base-url: http://localhost:5173
  jwt:
    secret: bicisafe-test-secret-no-usar-en-produccion-0123456789
    expiration-minutes: 60
    issuer: bicisafe
  mail:
    from: no-reply@test.local
  osm:
    nominatim:
      base-url: http://localhost:9090
  ors:
    base-url: http://localhost:9091
    api-key: test-key
  busqueda:
    limite-resultados: 6
