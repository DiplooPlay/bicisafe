spring:
  application:
    name: bicisafe
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  frontend:
    # Base URL used to build links inside emails (e.g. verification link)
    base-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    issuer: bicisafe
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:bicisafe@example.com}}
  busqueda:
    limite-resultados: ${BUSQUEDA_LIMITE_RESULTADOS:6}
  osm:
    nominatim:
      base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
  ors:
    base-url: ${ORS_BASE_URL:https://api.openrouteservice.org}
    api-key: ${ORS_API_KEY:}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bicisafe}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:1234}
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:bicisafe-dev-secret-cambiar-en-produccion-0123456789}

management:
  health:
    mail:
      enabled: false

logging:
  level:
    pe.edu.untels.bicisafe: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    pe.edu.untels.bicisafe: INFO
